# Z-Image 2-step, setting A with Qwen3-4B text: zimage_2step_1024_dlr1e-4.yaml, but the joint MMD and the critics read the prompt's
# Qwen3 context (token mean, L2 normalized, 2560-d) instead of SigLIP2 text, with beta scaled to keep the text kernel's
# median distance (sigma / 0.2211). The student's own condition is unchanged. 500 steps, the lr decays over them.
#
#   bash z-image/scripts/ours_four-cards.sh --root <root> --config z-image/configs/zimage_2step_1024_dlr1e-4_qwen.yaml
#
method: sw_lmmd
mode: zimage
exp_name: zimage-2step-1024-dlr1e-4-qwen
img_size: 1024
grad_checkpointing: true

zimage:
  attention_backend: _flash_3_varlen_hub
  repo: Tongyi-MAI/Z-Image-Turbo   # or a local snapshot directory
  context: auto                    # auto: the store's precomputed Qwen3 contexts (no Qwen3 on the
                                   # GPU) when it has them, else encode online | store | online
  feature_pool: auto               # auto: down to the size the references were encoded at,
                                   # from encoder_features/*.done.json (process/: 1024 -> 512 = 2x)
  feature_quantize: true           # reproduce the references' PNG + PIL BOX reduce exactly in the
                                   # forward (gradient = the average pool), so the critic cannot
                                   # tell the two sides apart by preprocessing
  max_sequence_length: 512         # online encoding only: the pipeline's padding / truncation
  text_cache: 512                  # online encoding only: contexts kept on GPU (LRU)
  vae_checkpointing: true

student:
  num_steps: 2
  sigmas: null                     # null = the Turbo schedule for num_steps: [1.0, 0.75]
  renoise: true                    # every step's output is a full image (DMD2-style)
  detach_between_steps: true
  step_weights: [1.0, 1.0]         # w_1, w_2

# built by /data/ironman/jiacheng/RDM/z-image/process (launch.py all). The contexts and renders sit
# in the root above reference_store/: move or copy the WHOLE root, then REFERENCE_ROOT=<root>/reference_store
reference_root: /data/ironman/jiacheng/RDM/z-image/process/artifacts/reference_v1/reference_store_qwen
qwen_text_repo: jiachengcui888/zimage-ref-qwen-text   # the launcher assembles the store above from it
output_dir: /data/thor/jiacheng/rdm-sets/zimage/work_dirs
encoders: [dinov3_l, siglip2, aimv2_huge]
joint: true

window:
  size: 128                        # K
  stride: 32                       # B
  cyclic: true
  order_seed: 3407
  random_start_each_epoch: true
  reverse_probability: 0.5
active_global_batch: 32            # B; must equal window.stride

loss:
  estimator: biased_mmd
  kernel: rbf
  kernel_block_size: 256

cache:
  refresh_every_windows: 20
  refresh_probe_rows: 64
  drift_threshold: 0.05
probe_every: 10

gan:
  enabled: true
  encoders: null
  weight: 1.5                      # per step: |g_adv,k| = 1.5 x |g_mmd,k|
  adaptive: true
  min_norm_ratio: 0.001
  loss: hinge
  lr: 1.0e-4
  betas: [0.0, 0.99]
  hidden: 1024
  depth: 2
  spectral_norm: true
  r1_gamma: 0.0
  g_start_step: 50
  conditional: true
  stats_rows: 8192
  seed: 0                          # step k's critic is seeded seed + k - 1

memory:
  shard: fsdp
  grad_reduce: none                # FSDP's reduce-scatter already averages
  optimizer: adamw8bit
  param_dtype: fp32                # master weights
  compute_dtype: bf16              # FSDP all-gathers in bf16
  battery_bf16: false              # the critic needs the store's encoder pipeline
  micro_batch: 2                   # candidate: two rows/rank; 2 GPUs => grad_accum=8; requires measured gate
  encoder_offload: false

lr: 2.83e-6                        # K128 · GAN's (klein-4B); untuned for the 6 B student
lr_schedule:
  name: cosine
  warmup_steps: 100
  min_lr_ratio: 0.1
  total_steps: null
grad_clip: 4.0
steps: 500
seed: 0

monitor_every: 1
print_freq: 1
save_freq: 500                     # weights-only fp32 checkpoints: 24.6 GB each
save_cache: false
save_optimizer: false
save_resume: true                  # weights + cache + both critics (not the FSDP-sharded optimizer)
resume_every: 50
