# Experiment 9: SW-LMMD + a BLOCK GAN critic + prompt-grouped windows on 2 x H100, COCO reference
# only (no GenEval block), K=128 / B=32.
#
#   bash scripts/run_machine-new9.sh --root <root>        # env, data, train, eval in one command
#
# Identical to sw_lmmd_train_h100_2gpu_gan_grouped.yaml ("K128 · GAN · grouped") except
# `gan.critic: block`. The row critic there gives every image its own logit, so it cannot see how
# the 4 seeds of a prompt relate -- and that is where the grouped runs lose GenEval: the seeds
# disagree on the object count (the 4 seeds of a counting prompt detect the same count for 30/80
# prompts in K128 · GAN · grouped and 22-26/80 in experiment 8, vs 46/80 for the teacher) and on
# which side an object goes (position, wrong side 62-79 of 400 in experiment 8 vs 33).
#
# The block critic takes one step's B=32 fresh rows (8 prompts x 4 seeds) as ONE sample, B x L,
# against the same rows' 32 references: rows are tokens (image feature + caption projection), a
# 2-layer Transformer without positional encoding mixes them, the mean token is scored. The critic
# trains on the step's fresh block only (`critic_rows: active`: one real, one fake per step; the
# window's 3 cached blocks are not used), and the generator term scores the same block
# (rdm/sw_lmmd/adversarial.py).
#
# Watch gan/d_acc: near 0.5 at step 50 (the end of the critic-only warm-up) means the critic has
# not learned yet, and the adaptive weight would then feed the generator noise at 1.5 x the force;
# pinned at 1.0 with gan/d_loss ~ 0 means it overpowers (gan.r1_gamma is the remedy).
#
# Expect, if the encoders' pooled features carry the count and the side: counting / position up
# toward the teacher, seed diversity down a little from 1.07x (part of it is count variation).
extends: sw_lmmd_train_h100_2gpu_gan_grouped.yaml
exp_name: sw-lmmd-flux-h100-2gpu-gan-grouped-blockcritic

# `extends` merges top-level keys only, so the whole block is restated.
gan:
  enabled: true
  encoders: null
  weight: 1.5                 # |g_adv| = 1.5 x |g_mmd|, as in the row-critic run
  adaptive: true
  min_norm_ratio: 0.001
  loss: hinge
  lr: 2.0e-4
  betas: [0.0, 0.99]
  hidden: 1024                # row-critic sizes, unused by the block critic
  depth: 2
  spectral_norm: true         # on the block critic's input / caption / output projections
  r1_gamma: 0.0
  g_start_step: 50
  conditional: true
  stats_rows: 8192
  seed: 0
  critic: block               # one logit per step's B=32 fresh rows (B x L), not per image
  critic_rows: active         # the critic trains on the step's fresh block only (1 real, 1 fake)
  block_width: 256
  block_layers: 2
  block_heads: 4
