# Experiment 1: SW-LMMD + GAN + prompt-grouped windows + COCO & GenEval reference, at 4x the
# samples per step -- window K=1024, B=128 fresh rows per step (32 prompts x 4 seeds).
#
#   bash scripts/run_machine-new1.sh --root <root>        # env, data, train, eval in one command
#
# Identical to sw_lmmd_train_h100_2gpu_gan_grouped_geneval.yaml (K=128 / B=32) except the window
# and B. Why: the K=128 / B=32 runs saw only 64k samples in 2000 steps -- ~15 visits per GenEval
# prompt, against ~1.84M samples / ~590 visits for iRDM s180 -- and both grouped runs were still
# improving at their last checkpoint (GenEval 0.786 at step 1400 -> 0.802 at 2000). B=128 gives
# 256k samples (~57 visits per GenEval prompt) and 32 prompts per step instead of 8. If GenEval
# rises toward 0.83 with diversity ~1x the teacher, the earlier gap was undertraining.
#
# Memory per card is unchanged (data parallel; micro_batch 4): B only sets grad_accum =
# 128 / (GPUs x 4) -> 16 on 2 GPUs, 8 on 4, 4 on 8. Each step does 4x the work of the B=32 run:
# about 10-12 h for 2000 steps on 2 x H100, half that on 4 [ESTIMATE].
extends: sw_lmmd_train_h100_2gpu_gan_grouped_geneval.yaml
exp_name: sw-lmmd-flux-h100-gan-grouped-geneval-k1024b128

# `extends` merges top-level keys only, so the whole block is restated.
window:
  size: 1024                  # K = 256 prompts x 4 rows
  stride: 128                 # B = 32 prompts x 4 rows (oldest cached row is 7 steps old)
  cyclic: true
  order_seed: 3407            # seeds the prompt permutation
  random_start_each_epoch: true
  reverse_probability: 0.5
  group_by_prompt: true
active_global_batch: 128      # B; must equal window.stride

# A step is ~4x longer than at B=32: write resume.pth every 100 steps (losing a run costs <= 100).
resume_every: 100
