# Reference-side ablation of the SW-LMMD attraction: the part the three mode configs share.
#
#   bash experiments/ref_ablation/run.sh <local|random|global> <seed>      # one run (2 x H100)
#
# Base: "K128 · GAN · grouped" (configs/sw_lmmd_train_h100_2gpu_gan_grouped.yaml), unchanged --
# window K=128 / B=32 with prompt-grouped rows (8 prompts x 4 seeds fresh per step), the row GAN
# critic at adaptive weight 1.5, fp32 encoder battery, micro_batch 4, lr 2.83e-6 with a 100-step
# warm-up then cosine to 0.1x, 2000 steps, encoders dinov3_l / siglip2 / aimv2_huge, seed 0, COCO
# reference only (no reference_extension).
#
# ref_local.yaml / ref_random.yaml / ref_global.yaml extend this file and differ in
# `ref_ablation.ref_mode` alone. Only the attraction's reference side changes: the repulsion, the
# window, the cache, the monitored mmd2 and the GAN critic (which keeps training on the window's
# own reference rows) are the same in all three.
extends: ../../../configs/sw_lmmd_train_h100_2gpu_gan_grouped.yaml
exp_name: sw-lmmd-refabl-k128b32-gan-grouped   # run dir: <exp_name>-<ref_mode>-s<seed>
